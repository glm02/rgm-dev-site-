<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1d4ed8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g filter="url(#glow)">
    <rect x="20" y="20" width="80" height="80" rx="20" fill="url(#blueGrad)" />
    <!-- Chevron / Bracket Path -->
    <path d="M50 48L40 60L50 72" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M70 48L80 60L70 72" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M64 44L56 76" stroke="#93c5fd" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Typographic Wordmark -->
  <text x="120" y="72" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#0f172a" letter-spacing="-0.03em">
    RGM<tspan fill="#2563eb">.DEV</tspan>
  </text>
  <text x="122" y="92" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="0.18em">
    FULLSTACK &amp; AUTOMATISATION IA
  </text>
</svg>
